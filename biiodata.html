<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pribadi Saya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Profil Pribadi Saya</h1>
        </header>

        <div class="profile-pic-container">
            <img src="OIP.webp" alt="Foto Profil Saya" class="profile-pic">
        </div>

        <section class="biodata-section">
            <h2>Biodata</h2>
            <table>
                <tr>
                    <th>Nama</th>
                    <td>Nama Lengkap Kamu</td>
                </tr>
                <tr>
                    <th>Kelas</th>
                    <td>Kelas Kamu (misal: X-RPL)</td>
                </tr>
                <tr>
                    <th>Sekolah</th>
                    <td>Nama Sekolah Kamu</td>
                </tr>
                <tr>
                    <th>Hobi</th>
                    <td>Membaca, Koding, Bersepeda</td>
                </tr>
            </table>
        </section>

        <section class="skills-section">
            <h2>Keterampilan</h2>
            <ul>
                <li>HTML & CSS Dasar</li>
                <li>Desain Grafis (UI/UX)</li>
                <li>Kemampuan Komunikasi</li>
                <li>Problem Solving</li>
            </ul>
        </section>

        <section class="contact-section">
            <h2>Hubungi Saya</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Nama:</label>
                    <input type="text" id="name" name="name" required placeholder="Masukkan nama kamu">
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="Masukkan email kamu">
                </div>
                
                <div class="form-group">
                    <label for="message">Pesan:</label>
                    <textarea id="message" name="message" rows="4" required placeholder="Tulis pesan di sini..."></textarea>
                </div>
                
                <button type="submit">Kirim Pesan</button>
            </form>
        </section>
    </div>

</body>
</html>
